name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, integration, broken-state, and Skill validation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Utility smoke test
        run: python3 skills/skill-code-review-full-on/scripts/review_tool --help
